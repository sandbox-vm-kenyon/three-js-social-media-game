<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Social Media Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 10;
    }
    #fps {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #0f0;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <p>Three.js Social Media Game</p>
    <p>Camera Position: <span id="cameraPos">0, 0, 0</span></p>
  </div>
  <div id="fps">FPS: <span id="fpsCounter">0</span></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
